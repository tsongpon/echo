openapi: 3.1.0

info:
  title: Echo API
  version: 1.0.0
  description: |
    The Echo feedback platform API.

    All request bodies are JSON; all responses are JSON. Authentication uses a
    Bearer JWT issued by `POST /v1/login` and carried in the `Authorization`
    header as `Bearer <access_token>`. Routes marked with a lock icon require
    this token; public routes do not.

    The dev server listens on `http://localhost:1323`.

servers:
  - url: http://localhost:1323
    description: Local development server

tags:
  - name: System
    description: Liveness and API documentation endpoints.
  - name: Auth
    description: Registration, login, and email verification.
  - name: Employees
    description: Employee profile and organization directory.
  - name: Invitations
    description: Organization invitation tokens (org admins only).
  - name: Feedback Periods
    description: Windows during which feedback can be collected.
  - name: Feedback
    description: Peer feedback entries filed against colleagues.
  - name: Feedback Drafts
    description: |
      Work-in-progress feedback entries private to their author. A draft is
      started, edited, and finally submitted (at which point it becomes a
      regular feedback entry), or deleted.

# ----------------------------------------------------------------------------
# Paths
# ----------------------------------------------------------------------------
paths:
  /ping:
    get:
      tags: [System]
      summary: Liveness check
      description: Returns `pong` when the server is up. No authentication.
      operationId: ping
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            text/plain:
              schema:
                type: string
                const: pong
              examples:
                ok:
                  value: pong

  /v1/openapi.yaml:
    get:
      tags: [System]
      summary: OpenAPI specification
      description: Returns this OpenAPI 3.1 document as YAML. No authentication.
      operationId: getOpenApiSpec
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            text/yaml:
              schema:
                type: string

  /v1/docs:
    get:
      tags: [System]
      summary: Swagger UI
      description: |
        Interactive API documentation (Swagger UI) loaded from `/v1/openapi.yaml`.
        No authentication. The page is served as HTML and pulls
        `swagger-ui-bundle.js` from a public CDN.
      operationId: getDocs
      security: []
      responses:
        "200":
          description: The Swagger UI HTML page.
          content:
            text/html:
              schema:
                type: string

  /v1/register:
    post:
      tags: [Auth]
      summary: Register a new employee
      description: |
        Creates a new employee and returns the created record. The `password`
        is hashed server-side with bcrypt and never returned. A fresh account
        has `is_mail_verified: false` and `role: "org_admin"` when registered
        without an invitation. On success the server sends a verification email
        (logged to stdout when no mailer is configured).

        Authorization by invitation token:
          * With a non-empty `invite_token`: the token is verified and, on
            success, its organization name overrides whatever the client
            supplied, and the role is `"user"`. An invalid/expired token is
            rejected with `400 "invalid or expired invitation token"`.
          * Without a token: the client-supplied `organization_name` is
            required and honored, and the role is `"org_admin"` (the first
            admin).
      operationId: registerEmployee
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterEmployeeRequest"
            examples:
              firstAdmin:
                summary: First admin (no invitation)
                value:
                  name: Alice
                  organization_name: Acme
                  manager_id: null
                  title: Senior Engineer
                  email: alice@example.com
                  password: supersecret
                  invite_token: ""
      responses:
        "201":
          description: The created employee. The `password` field is omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: An employee with that email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                emailTaken:
                  value: { message: "email already taken" }
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Authenticates an employee by email and password and returns a signed
        JWT on success. Invalid email or wrong password both return
        `401 "invalid email or password"` to avoid leaking which was wrong.
        If the credentials are valid but the email is not verified, returns
        `403 "email not verified"`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid:
                  value: { message: "invalid email or password" }
        "403":
          description: Email not verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unverified:
                  value: { message: "email not verified" }
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/verify-email:
    get:
      tags: [Auth]
      summary: Verify an email address
      description: |
        Validates the email-verification token supplied in the `token` query
        parameter and, on success, marks the matching employee's email as
        verified. Public and idempotent: verifying an already-verified email
        succeeds again with the same `200` response.
      operationId: verifyEmail
      security: []
      parameters:
        - $ref: "#/components/parameters/VerificationToken"
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
              examples:
                ok:
                  value: { message: "email verified" }
        "400":
          description: Missing, malformed, expired, or wrong-purpose token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid:
                  value: { message: "invalid or expired verification token" }

  /v1/me:
    get:
      tags: [Employees]
      summary: Get the current employee's profile
      description: |
        Returns the profile of the authenticated employee. The employee is
        looked up by the token's subject (the employee ID).
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The authenticated employee. The `password` field is omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The token's subject no longer matches a stored employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  value: { message: "employee not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/employees:
    get:
      tags: [Employees]
      summary: List employees in the caller's organization
      description: |
        Returns one page of employees in the authenticated caller's
        organization, ordered by name ascending. An employee can only see
        their own organization's members. The response omits the `password`
        field. The caller is included in the list; the frontend should filter
        the caller out when populating a reviewee picker (the backend enforces
        no self-review at `POST /v1/feedbacks`).

        Pagination is cursor-based: pass the `next_cursor` value from one
        response as the `cursor` query parameter on the next request. When
        `next_cursor` is `null` there are no more pages. An unknown cursor
        (one that does not refer to an existing employee) returns `400`.
      operationId: listEmployees
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: One page of employees plus the next-page cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"
        "400":
          description: Unknown cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownCursor:
                  value: { message: "unknown cursor" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/invitation:
    post:
      tags: [Invitations]
      summary: Create an invitation token
      description: |
        Issues a signed invitation token that lets the bearer register as a
        member of the named organization. The caller must have
        `role: "org_admin"`; any other role returns `403`. The returned
        `token` is then passed as `invite_token` in `POST /v1/register` to
        create the invitee's account with `role: "user"`.
      operationId: createInvitation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
            examples:
              acme:
                value:
                  organization_name: Acme
      responses:
        "201":
          description: The signed invitation token and its metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an org admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notAdmin:
                  value: { message: "only org admins can create invitations" }
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/feedback-periods:
    post:
      tags: [Feedback Periods]
      summary: Create a feedback period
      description: |
        Opens a feedback period for the authenticated employee's organization.
        The caller must have `role: "org_admin"`; any other role returns `403`.
        The `organization_name` is taken from the caller's JWT (not the body),
        so a client cannot open a period for an org they do not belong to.
      operationId: createFeedbackPeriod
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackPeriodRequest"
            examples:
              h2:
                summary: H2 2026
                value:
                  name: H2 2026
                  start_date: "2026-07-01T00:00:00Z"
                  end_date: "2026-12-31T23:59:59Z"
      responses:
        "201":
          description: The created feedback period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackPeriodResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an org admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notAdmin:
                  value: { message: "only org admins can create feedback periods" }
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Feedback Periods]
      summary: List feedback periods
      description: |
        Returns the feedback periods for the authenticated employee's
        organization, ordered by start date descending (most recent first).
        Any authenticated employee may list periods (an employee needs to see
        periods in order to file feedback against them). The organization is
        taken from the caller's JWT, so an employee can only see their own
        organization's periods.
      operationId: listFeedbackPeriods
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The feedback periods for the caller's organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackPeriodListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/feedbacks:
    post:
      tags: [Feedback]
      summary: File a feedback entry
      description: |
        Files a feedback entry for a colleague. The reviewer is the
        authenticated employee (taken from the JWT subject), so `reviewer_id`
        in the body is ignored. A reviewer cannot review themselves.

        Validation:
          * `period_id` is required and must refer to an existing feedback
            period (the service validates it before persisting).
          * The period's date window must be open: now must fall within
            [start_date, end_date]. A not-yet-open or already-ended period
            returns `422`.
          * `reviewee_id` is required and must differ from the reviewer.
          * Each of the six score fields must be an integer in [1, 5].
          * `visibility` defaults to `"anonymous"` when omitted or empty, and
            must otherwise be one of `anonymous`, `named`.

        The created entry has `status: "submitted"`. To write feedback
        incrementally instead, start a draft via `POST /v1/feedback-drafts`.
      operationId: createFeedback
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackRequest"
            examples:
              sample:
                value:
                  period_id: 0190abcd-0000-7000-8000-000000000000
                  reviewee_id: 0190bbbb-0000-7000-8000-000000000000
                  communication_score: 4
                  leadership_score: 5
                  technical_score: 3
                  collaboration_score: 4
                  delivery_score: 5
                  trust_score: 2
                  strengths_comment: great teammate
                  weaknesses_comment: could document more
                  visibility: anonymous
      responses:
        "201":
          description: The created feedback entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The period's date window is not open (not started or already ended).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                closed:
                  value: { message: "feedback period is not open for submission" }
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/feedbacks:
    get:
      tags: [Feedback]
      summary: List feedback received by the current employee
      description: |
        Returns one page of feedback entries received by the authenticated
        employee (i.e. entries others have written about them), ordered by
        `created_at` descending (newest first). The reviewee is the
        authenticated employee (taken from the JWT subject), so an employee can
        only list their own received feedback.

        Pagination is cursor-based: pass the `next_cursor` value from one
        response as the `cursor` query parameter on the next request. When
        `next_cursor` is `null` there are no more pages. An unknown cursor
        (one that does not refer to an existing feedback entry) returns `400`.

        Visibility policy: for entries with `visibility: "anonymous"`, the
        reviewer's identity is hidden from the reviewee (the caller of this
        endpoint) — `reviewer_id` is empty in the response. Entries with
        `visibility: "named"` include `reviewer_id` as usual.
      operationId: listMyFeedbacks
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: One page of received feedback plus the next-page cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackListResponse"
        "400":
          description: Unknown cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownCursor:
                  value: { message: "unknown cursor" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/given-feedbacks:
    get:
      tags: [Feedback]
      summary: List feedback submitted by the current employee
      description: |
        Returns one page of feedback entries the authenticated employee has
        submitted (i.e. entries they wrote as the reviewer), ordered by
        `created_at` descending (newest first). The reviewer is the
        authenticated employee (taken from the JWT subject), so an employee
        can only list the feedback they gave themselves. Only submitted
        entries are listed; drafts stay in `GET /v1/feedback-drafts`.

        Pagination is cursor-based: pass the `next_cursor` value from one
        response as the `cursor` query parameter on the next request. When
        `next_cursor` is `null` there are no more pages. An unknown cursor
        (one that does not refer to an existing feedback entry) returns `400`.

        Visibility policy: none applies here — the caller is the reviewer of
        every entry, so `reviewer_id` is always included, even for anonymous
        entries (an author always knows their own identity).
      operationId: listMyGivenFeedbacks
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: One page of given feedback plus the next-page cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackGivenListResponse"
        "400":
          description: Unknown cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownCursor:
                  value: { message: "unknown cursor" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/feedback-drafts:
    post:
      tags: [Feedback Drafts]
      summary: Start a feedback draft
      description: |
        Creates a draft feedback entry owned by the authenticated employee.
        Unlike `POST /v1/feedbacks`, a draft requires only `period_id` and
        `reviewee_id`: scores, comments, and visibility may be filled in later
        via `PATCH /v1/feedback-drafts/{id}`.

        At most one draft may exist per (reviewer, reviewee, period) triple; a
        duplicate returns `409`. The reviewer cannot draft a self-review
        (`400`), and `period_id` must refer to an existing period (`400`).
        The period's date window is intentionally NOT enforced here: a draft
        may be started before the period opens and will fail at submit time if
        the window is still shut.

        Supplied scores are bounds-checked ([1, 5]) but not required.
      operationId: createFeedbackDraft
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackDraftRequest"
            examples:
              minimal:
                summary: Start with just the target and period
                value:
                  period_id: 0190abcd-0000-7000-8000-000000000000
                  reviewee_id: 0190bbbb-0000-7000-8000-000000000000
              partial:
                summary: Start with some scores already filled
                value:
                  period_id: 0190abcd-0000-7000-8000-000000000000
                  reviewee_id: 0190bbbb-0000-7000-8000-000000000000
                  communication_score: 4
                  strengths_comment: work in progress
                  visibility: anonymous
      responses:
        "201":
          description: The created draft, with status "draft".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The reviewer already has a draft for this (reviewee, period) pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                exists:
                  value: { message: "a draft for this reviewee and period already exists" }
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Feedback Drafts]
      summary: List the caller's feedback drafts
      description: |
        Returns one page of the authenticated employee's own draft entries,
        ordered by `created_at` descending (newest first). Only drafts are
        listed; feedback entries the caller has already submitted are not
        included. No reviewer redaction applies: the author always sees their
        own `reviewer_id`.

        Pagination is cursor-based: pass the `next_cursor` value from one
        response as the `cursor` query parameter on the next request. When
        `next_cursor` is `null` there are no more pages. An unknown cursor
        returns `400 "unknown cursor"`.
      operationId: listMyFeedbackDrafts
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: One page of the caller's drafts plus the next-page cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackDraftListResponse"
        "400":
          description: Unknown cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownCursor:
                  value: { message: "unknown cursor" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/feedback-drafts/{id}:
    get:
      tags: [Feedback Drafts]
      summary: Get one of the caller's drafts
      description: |
        Returns the named draft when it belongs to the authenticated caller.
        A draft owned by anyone else — like a draft that does not exist —
        returns `404` rather than `403`, so a draft's existence never leaks to
        other employees.
      operationId: getFeedbackDraft
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No draft matches the ID for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  value: { message: "feedback draft not found" }
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Feedback Drafts]
      summary: Update one of the caller's drafts
      description: |
        Applies a partial update to the caller's draft. Only fields present in
        the body are overwritten; omitted fields keep their stored values.
        `period_id`, `reviewee_id`, and `reviewer_id` are fixed once the draft
        exists and cannot be changed. Supplied scores are bounds-checked
        ([1, 5]); comments may be cleared; `visibility` may be set (default
        `anonymous`) but must be one of `anonymous`, `named`.

        A draft may be incomplete: the full submit-time validation (all six
        scores required, both comments required, period window open) runs at
        `POST /v1/feedback-drafts/{id}/submit`, not here.
      operationId: updateFeedbackDraft
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeedbackDraftRequest"
            examples:
              scores:
                summary: Fill in two scores, leave the rest untouched
                value:
                  communication_score: 4
                  trust_score: 5
              clearComment:
                summary: Clear a comment
                value:
                  weaknesses_comment: ""
      responses:
        "200":
          description: The updated draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No draft matches the ID for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  value: { message: "feedback draft not found" }
        "409":
          description: The draft changed after this request read it; fetch it again and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                concurrent:
                  value: { message: "draft was modified concurrently; fetch it again and retry" }
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Feedback Drafts]
      summary: Delete one of the caller's drafts
      description: |
        Removes the caller's draft and immediately releases its
        (reviewer, reviewee, period) slot, so a new draft may be started for
        the same pair right away. Deleting an entry that is missing or no
        longer a draft returns `404`; submitted feedback is immutable.
      operationId: deleteFeedbackDraft
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "204":
          description: The draft was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No draft matches the ID for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  value: { message: "feedback draft not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/feedback-drafts/{id}/submit:
    post:
      tags: [Feedback Drafts]
      summary: Submit one of the caller's drafts
      description: |
        Transitions the caller's draft to the submitted state and releases its
        (reviewer, reviewee, period) slot. The request body is optional; when
        present it carries the same shape as the update request and its fields
        are applied before validation, letting a client submit and final-edit
        in one call.

        Full validation runs here:
          * All six score fields must be present and in [1, 5] (`400`).
          * `strengths_comment` and `weaknesses_comment` must be non-empty (`400`).
          * The period's date window must be open — now must fall within
            [start_date, end_date] (`422`).

        On success the entry behaves exactly like one created via
        `POST /v1/feedbacks`: it appears in the reviewee's and their manager's
        listings (subject to the visibility policy).
      operationId: submitFeedbackDraft
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeedbackDraftRequest"
            examples:
              finalEdit:
                summary: Fill in the last fields and submit
                value:
                  communication_score: 4
                  leadership_score: 5
                  technical_score: 3
                  collaboration_score: 4
                  delivery_score: 5
                  trust_score: 2
                  strengths_comment: great teammate
                  weaknesses_comment: could document more
                  visibility: named
      responses:
        "200":
          description: The submitted feedback entry, with status "submitted".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No draft matches the ID for this caller (or it was already submitted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  value: { message: "feedback draft not found" }
        "409":
          description: The draft changed after this request read it; fetch it again and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                concurrent:
                  value: { message: "draft was modified concurrently; fetch it again and retry" }
        "422":
          description: The period's date window is not open (not started or already ended).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                closed:
                  value: { message: "feedback period is not open for submission" }
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/employees/{id}/manager:
    patch:
      tags: [Employees]
      summary: Assign or clear an employee's manager
      description: |
        Sets (or, when `manager_id` is `null`, clears) the manager of the named
        employee. Only org admins may do this; the check is a fresh-load check
        server-side, so a stale token cannot grant privileges the caller no
        longer has. The target and the new manager must belong to the caller's
        organization.

        Validation: the new manager must exist, be in the same organization,
        not be the target themselves, and the assignment must not create a
        management cycle (the manager chain is walked server-side, capped at
        50 hops; a longer or already-cyclic chain is rejected). Clearing the
        manager (`manager_id: null`) skips these checks: removing a parent
        pointer cannot create a cycle.
      operationId: assignManager
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The employee ID whose manager is being assigned.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignManagerRequest"
            examples:
              assign:
                summary: Assign a manager
                value:
                  manager_id: 0190aaaa-0001-7000-8000-000000000000
              clear:
                summary: Clear the manager
                value:
                  manager_id: null
      responses:
        "200":
          description: The updated employee, with the new `manager_id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "400":
          description: |
            Malformed body or a failed validation (unknown manager ID,
            cross-org manager, self-assignment, or a would-be cycle).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                cycle:
                  value: { message: "assignment would create a management cycle" }
                unknownManager:
                  value: { message: "manager_id does not refer to an existing employee" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an org admin, or the target is in another organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notAdmin:
                  value: { message: "only org admins can assign managers within their organization" }
        "404":
          description: No employee matches the target ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  value: { message: "employee not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/reports:
    get:
      tags: [Employees]
      summary: List the current employee's direct reportees
      description: |
        Returns one page of employees whose `manager_id` is the authenticated
        caller (i.e. the caller's direct reportees), ordered by name ascending.
        The manager is the authenticated employee (taken from the JWT subject),
        so an employee can only list their own reportees. An employee with no
        reportees gets an empty list. The response omits the `password` field.

        Pagination is cursor-based: pass the `next_cursor` value from one
        response as the `cursor` query parameter on the next request. When
        `next_cursor` is `null` there are no more pages. An unknown cursor
        (one that does not refer to an existing employee) returns `400`.
      operationId: listMyReports
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: One page of reportees plus the next-page cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"
        "400":
          description: Unknown cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownCursor:
                  value: { message: "unknown cursor" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/employees/{id}/feedbacks:
    get:
      tags: [Feedback]
      summary: List feedback received by an employee (manager view)
      description: |
        Returns one page of feedback entries received by the named employee,
        but only when the authenticated caller is that employee's manager.
        Ordered by `created_at` descending (newest first). A caller who is not
        the reviewee's manager — including the reviewee themselves — gets
        `403`; an unknown employee ID gets `404`.

        Pagination is cursor-based: pass the `next_cursor` value from one
        response as the `cursor` query parameter on the next request. When
        `next_cursor` is `null` there are no more pages. An unknown cursor
        (one that does not refer to an existing feedback entry) returns `400`.

        Visibility policy: the manager never sees who wrote an entry —
        `reviewer_id` is always empty in this view, including for entries
        with `visibility: "named"`. The comments themselves are returned in
        full. This differs from the reviewee's own view
        (`GET /v1/me/feedbacks`), where named entries still include
        `reviewer_id`.
      operationId: listEmployeeFeedbacks
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The employee ID whose received feedback is being listed.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: One page of received feedback plus the next-page cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackManagerListResponse"
        "400":
          description: Unknown cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownCursor:
                  value: { message: "unknown cursor" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not the named employee's manager.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notManager:
                  value: { message: "only the employee's manager can view their feedback" }
        "404":
          description: No employee matches the ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  value: { message: "employee not found" }
        "500":
          $ref: "#/components/responses/InternalError"

# ----------------------------------------------------------------------------
# Components
# ----------------------------------------------------------------------------
components:
  parameters:
    VerificationToken:
      name: token
      in: query
      required: true
      description: The email-verification JWT issued at registration.
      schema:
        type: string
      example: eyJhbGciOiJIUzI1NiIs...

    ListLimit:
      name: limit
      in: query
      required: false
      description: |
        Page size. Non-numeric or `<= 0` falls back to the default (20);
        values above `100` are capped.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    ListCursor:
      name: cursor
      in: query
      required: false
      description: |
        The `next_cursor` value from the previous page (an employee ID).
        Omit on the first page. An unknown cursor returns `400 "unknown cursor"`.
      schema:
        type: string
      example: 0190aaaa-0000-7000-8000-000000000000

    DraftId:
      name: id
      in: path
      required: true
      description: The draft feedback entry ID. Must belong to the caller.
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthorized:
              value: { message: "missing or invalid token" }

    ValidationError:
      description: |
        Malformed request body or a failed validation. The `message` carries
        the specific reason (e.g. `"name is required"`,
        `"end_date must be after start_date"`,
        `"period_id does not refer to an existing feedback period"`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidBody:
              value: { message: "invalid request body" }
            validation:
              value: { message: "name is required" }

    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            internal:
              value: { message: "failed to register employee" }

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A signed JWT obtained from `POST /v1/login`. Send as
        `Authorization: Bearer <access_token>`.

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: A human-readable description of the error.
      required: [message]

    Role:
      type: string
      description: The authorization role of an employee within their organization.
      enum:
        - org_admin
        - user
      examples:
        - org_admin

    FeedbackVisibility:
      type: string
      description: Whether the reviewer's identity is attributed on a feedback entry.
      enum:
        - anonymous
        - named
      examples:
        - anonymous

    FeedbackStatus:
      type: string
      description: |
        The lifecycle state of a feedback entry. `draft` entries are private
        to their author and excluded from the reviewee's and manager's
        listings; `submitted` entries are visible per the visibility policy.
        Entries created before the status field existed are reported as
        `submitted`.
      enum:
        - draft
        - submitted
      examples:
        - submitted

    Score:
      type: integer
      description: A Likert-style score in the range 1–5.
      minimum: 1
      maximum: 5
      example: 4

    DraftScore:
      type: integer
      description: |
        A score on a feedback entry as stored. Drafts may have 0 for
        "not filled in yet"; submitted entries always have 1-5.
      minimum: 0
      maximum: 5
      example: 4
    OptionalScore:
      type: [integer, "null"]
      description: |
        An optionally-supplied score on a draft create/update request. Null
        (or omitted) leaves the field unset/unchanged; a supplied value must
        be in 1–5.
      minimum: 1
      maximum: 5

    EmployeeResponse:
      type: object
      description: The representation of an employee returned to clients. The `password` field is omitted.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        organization_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        manager_id:
          type: string
          format: uuid
          nullable: true
          description: The employee ID of the user's manager, or null.
        title:
          type: string
        email:
          type: string
          format: email
        is_mail_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - organization_name
        - role
        - title
        - email
        - is_mail_verified
        - created_at
        - updated_at
      example:
        id: 0190aaaa-0000-7000-8000-000000000000
        name: Alice
        organization_name: Acme
        role: org_admin
        manager_id: null
        title: Senior Engineer
        email: alice@example.com
        is_mail_verified: true
        created_at: "2026-08-18T10:00:00Z"
        updated_at: "2026-08-18T10:00:00Z"

    EmployeeListResponse:
      type: object
      description: One page of employees plus the next-page cursor.
      properties:
        employees:
          type: array
          description: The employees on this page. Never null (empty array when no members).
          items:
            $ref: "#/components/schemas/EmployeeResponse"
        next_cursor:
          type: string
          format: uuid
          nullable: true
          description: |
            The ID of the last employee on this page; pass it as `cursor` on
            the next request. Null when there are no more pages.
      required: [employees, next_cursor]
      example:
        employees:
          - id: 0190aaaa-0000-7000-8000-000000000000
            name: Alice
            organization_name: Acme
            role: org_admin
            manager_id: null
            title: Senior Engineer
            email: alice@example.com
            is_mail_verified: true
            created_at: "2026-08-18T10:00:00Z"
            updated_at: "2026-08-18T10:00:00Z"
        next_cursor: 0190aaaa-0000-7000-8000-000000000000

    RegisterEmployeeRequest:
      type: object
      description: Request body for `POST /v1/register`.
      properties:
        name:
          type: string
          description: Trimmed; must not be empty.
        organization_name:
          type: string
          description: Required when `invite_token` is empty (first admin); ignored otherwise.
        role:
          $ref: "#/components/schemas/Role"
          description: Omitted/ignored on input — the server assigns it from `invite_token`.
        manager_id:
          type: string
          format: uuid
          nullable: true
          description: Employee ID of the user's manager, or null.
        title:
          type: string
          description: Job title. Defaults to "".
        email:
          type: string
          format: email
          description: Stored lowercased; uniqueness is global across organizations.
        password:
          type: string
          format: password
          description: Plaintext; max 64 characters. Hashed server-side and never returned.
          maxLength: 64
        invite_token:
          type: string
          description: |
            If empty, the employee is created with `role: "org_admin"` (the
            first admin). If a valid invitation token is supplied, `role: "user"`.
          default: ""
      required: [name, organization_name, email, password]

    AssignManagerRequest:
      type: object
      description: Request body for `PATCH /v1/employees/{id}/manager`.
      properties:
        manager_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The employee ID to assign as the target's manager, or `null` to
            clear the assignment. The manager must exist, belong to the same
            organization as the caller, not be the target themselves, and not
            create a management cycle; `null` skips these checks.
      required: [manager_id]
      example:
        manager_id: 0190aaaa-0001-7000-8000-000000000000

    LoginRequest:
      type: object
      description: Request body for `POST /v1/login`.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required: [email, password]
      example:
        email: alice@example.com
        password: supersecret

    LoginResponse:
      type: object
      description: Returned by `POST /v1/login` on success.
      properties:
        access_token:
          type: string
          description: "A signed JWT (HS256). Send as `Authorization: Bearer <access_token>`."
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Token lifetime in seconds.
          example: 86400
        employee:
          $ref: "#/components/schemas/EmployeeResponse"
      required: [access_token, token_type, expires_in, employee]

    CreateInvitationRequest:
      type: object
      description: Request body for `POST /v1/invitation`.
      properties:
        organization_name:
          type: string
          description: The organization the invitee will join.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            ISO 8601 timestamp overriding the default 7-day lifetime. If
            omitted the token expires after 7 days. Must be in the future.
      required: [organization_name]
      example:
        organization_name: Acme

    InvitationResponse:
      type: object
      description: The signed invitation token and its metadata.
      properties:
        token:
          type: string
          description: The signed JWT the bearer presents at registration.
        id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
          description: The inviter employee ID.
        organization_name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      required: [token, id, created_by, organization_name, created_at, expires_at]
      example:
        token: eyJhbGciOiJIUzI1NiIs...
        id: 0190abcd-0000-7000-8000-000000000000
        created_by: 0190aaaa-0000-7000-8000-000000000000
        organization_name: Acme
        created_at: "2026-08-18T10:00:00Z"
        expires_at: "2026-08-25T10:00:00Z"

    CreateFeedbackPeriodRequest:
      type: object
      description: |
        Request body for `POST /v1/feedback-periods`. `organization_name` is
        taken from the JWT and is not trusted from the body.
      properties:
        name:
          type: string
          description: Trimmed; must not be empty.
        start_date:
          type: string
          format: date-time
          description: Must not be the zero time.
        end_date:
          type: string
          format: date-time
          nullable: true
          description: |
            Required (must not be the zero time) and must be after
            `start_date`. Nullable on input for client convenience but always
            present in the response.
      required: [name, start_date, end_date]

    FeedbackPeriodResponse:
      type: object
      description: A feedback period.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        organization_name:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, organization_name, start_date, end_date, created_at, updated_at]
      example:
        id: 0190abcd-0000-7000-8000-000000000000
        name: H2 2026
        organization_name: Acme
        start_date: "2026-07-01T00:00:00Z"
        end_date: "2026-12-31T23:59:59Z"
        created_at: "2026-08-18T10:00:00Z"
        updated_at: "2026-08-18T10:00:00Z"

    FeedbackPeriodListResponse:
      type: object
      description: The list of feedback periods for an organization.
      properties:
        periods:
          type: array
          description: The periods, ordered by start_date descending. Never null.
          items:
            $ref: "#/components/schemas/FeedbackPeriodResponse"
      required: [periods]

    CreateFeedbackRequest:
      type: object
      description: |
        Request body for `POST /v1/feedbacks`. The reviewer is taken from the
        JWT and `reviewer_id` in the body is ignored.
      properties:
        period_id:
          type: string
          format: uuid
          description: Must refer to an existing feedback period.
        reviewee_id:
          type: string
          format: uuid
          description: Must differ from the reviewer (no self-review).
        communication_score:
          $ref: "#/components/schemas/Score"
        leadership_score:
          $ref: "#/components/schemas/Score"
        technical_score:
          $ref: "#/components/schemas/Score"
        collaboration_score:
          $ref: "#/components/schemas/Score"
        delivery_score:
          $ref: "#/components/schemas/Score"
        trust_score:
          $ref: "#/components/schemas/Score"
        strengths_comment:
          type: string
          minLength: 1
          description: Required; must not be empty after trim.
        weaknesses_comment:
          type: string
          minLength: 1
          description: Required; must not be empty after trim.
        visibility:
          $ref: "#/components/schemas/FeedbackVisibility"
          description: Defaults to `anonymous` when omitted or empty.
      required:
        - period_id
        - reviewee_id
        - communication_score
        - leadership_score
        - technical_score
        - collaboration_score
        - delivery_score
        - trust_score
        - strengths_comment
        - weaknesses_comment

    FeedbackResponse:
      type: object
      description: A feedback entry.
      properties:
        id:
          type: string
          format: uuid
        period_id:
          type: string
          format: uuid
        reviewee_id:
          type: string
          format: uuid
        reviewer_id:
          type: string
          format: uuid
          description: The employee who filed the feedback (from the JWT).
        communication_score:
          $ref: "#/components/schemas/DraftScore"
        leadership_score:
          $ref: "#/components/schemas/DraftScore"
        technical_score:
          $ref: "#/components/schemas/DraftScore"
        collaboration_score:
          $ref: "#/components/schemas/DraftScore"
        delivery_score:
          $ref: "#/components/schemas/DraftScore"
        trust_score:
          $ref: "#/components/schemas/DraftScore"
        strengths_comment:
          type: string
        weaknesses_comment:
          type: string
        visibility:
          $ref: "#/components/schemas/FeedbackVisibility"
        status:
          $ref: "#/components/schemas/FeedbackStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - period_id
        - reviewee_id
        - reviewer_id
        - communication_score
        - leadership_score
        - technical_score
        - collaboration_score
        - delivery_score
        - trust_score
        - strengths_comment
        - weaknesses_comment
        - visibility
        - status
        - created_at
        - updated_at

    FeedbackListResponse:
      type: object
      description: |
        One page of feedback entries received by the caller plus the next-page
        cursor. For entries with `visibility: "anonymous"`, `reviewer_id` is
        empty so the reviewee (the caller of `GET /v1/me/feedbacks`) cannot
        identify the reviewer; `reviewer_id` is present for `visibility: "named"`
        entries.
      properties:
        feedbacks:
          type: array
          description: The feedback entries on this page, ordered by created_at descending. Never null (empty array when the caller has received no feedback).
          items:
            $ref: "#/components/schemas/FeedbackListItemResponse"
        next_cursor:
          type: string
          format: uuid
          nullable: true
          description: |
            The ID of the last feedback entry on this page; pass it as `cursor`
            on the next request. Null when there are no more pages.
      required: [feedbacks, next_cursor]
      example:
        feedbacks:
          - id: 0190abcd-0000-7000-8000-000000000000
            period_id: 0190abca-0000-7000-8000-000000000000
            reviewee_id: 0190aaaa-0000-7000-8000-000000000000
            reviewer_id: 0190bbbb-0000-7000-8000-000000000000
            communication_score: 4
            leadership_score: 5
            technical_score: 3
            collaboration_score: 4
            delivery_score: 5
            trust_score: 2
            strengths_comment: great teammate
            weaknesses_comment: could document more
            visibility: named
            status: submitted
            created_at: "2026-08-18T10:00:00Z"
            updated_at: "2026-08-18T10:00:00Z"
        next_cursor: 0190abcd-0000-7000-8000-000000000000

    # FeedbackListItemResponse is FeedbackResponse but with reviewer_id as a
    # plain string (no uuid format) so it may be empty for anonymous entries,
    # which the list endpoint redacts. Reuses every other field/requirement via
    # allOf so it stays in sync with FeedbackResponse.
    FeedbackListItemResponse:
      allOf:
        - $ref: "#/components/schemas/FeedbackResponse"
        - type: object
          properties:
            reviewer_id:
              type: string
              description: |
                The employee who filed the feedback. Empty for entries with
                visibility: "anonymous" (the reviewer's identity is hidden from
                the reviewee). A UUID for visibility: "named" entries.
          required: [reviewer_id]

    # FeedbackManagerItemResponse is FeedbackResponse with reviewer_id always
    # empty: the manager view blinds who wrote every entry, named or
    # anonymous, while returning comments in full.
    FeedbackManagerItemResponse:
      allOf:
        - $ref: "#/components/schemas/FeedbackResponse"
        - type: object
          properties:
            reviewer_id:
              type: string
              description: |
                Always empty in the manager view: the manager never sees who
                wrote the feedback, including for visibility: "named" entries.
                The reviewee still sees named reviewers in their own view
                (GET /v1/me/feedbacks).
              const: ""
          required: [reviewer_id]

    FeedbackManagerListResponse:
      type: object
      description: |
        One page of feedback entries received by the caller's reportee plus
        the next-page cursor. The manager view blinds reviewer identities:
        reviewer_id is always empty, including for named entries. Comments
        are returned in full.
      properties:
        feedbacks:
          type: array
          description: The reportee's received feedback on this page, ordered by created_at descending. Never null (empty array when the reportee has received no feedback).
          items:
            $ref: "#/components/schemas/FeedbackManagerItemResponse"
        next_cursor:
          type: string
          format: uuid
          nullable: true
          description: |
            The ID of the last feedback entry on this page; pass it as `cursor`
            on the next request. Null when there are no more pages.
      required: [feedbacks, next_cursor]
    CreateFeedbackDraftRequest:
      type: object
      description: |
        Request body for `POST /v1/feedback-drafts`. The reviewer is taken from
        the JWT and `reviewer_id` in the body is ignored. Only `period_id` and
        `reviewee_id` are required; every other field may be filled in later
        via `PATCH /v1/feedback-drafts/{id}`.
      properties:
        period_id:
          type: string
          format: uuid
          description: Must refer to an existing feedback period. The period's date window is not enforced until submit.
        reviewee_id:
          type: string
          format: uuid
          description: Must differ from the reviewer (no self-review).
        communication_score:
          $ref: "#/components/schemas/OptionalScore"
          description: Optional at draft time; bounds-checked when supplied.
        leadership_score:
          $ref: "#/components/schemas/OptionalScore"
        technical_score:
          $ref: "#/components/schemas/OptionalScore"
        collaboration_score:
          $ref: "#/components/schemas/OptionalScore"
        delivery_score:
          $ref: "#/components/schemas/OptionalScore"
        trust_score:
          $ref: "#/components/schemas/OptionalScore"
        strengths_comment:
          type: string
          description: Optional at draft time; may be empty.
        weaknesses_comment:
          type: string
          description: Optional at draft time; may be empty.
        visibility:
          $ref: "#/components/schemas/FeedbackVisibility"
          description: Defaults to `anonymous` when omitted or empty.
      required: [period_id, reviewee_id]

    UpdateFeedbackDraftRequest:
      type: object
      description: |
        Request body for `PATCH /v1/feedback-drafts/{id}` and (optionally)
        `POST /v1/feedback-drafts/{id}/submit`. Every field is nullable and
        omitted fields are left unchanged; a supplied field overwrites the
        stored one. `period_id`, `reviewee_id`, and `reviewer_id` cannot be
        changed once the draft exists.
      properties:
        communication_score:
          $ref: "#/components/schemas/OptionalScore"
        leadership_score:
          $ref: "#/components/schemas/OptionalScore"
        technical_score:
          $ref: "#/components/schemas/OptionalScore"
        collaboration_score:
          $ref: "#/components/schemas/OptionalScore"
        delivery_score:
          $ref: "#/components/schemas/OptionalScore"
        trust_score:
          $ref: "#/components/schemas/OptionalScore"
        strengths_comment:
          type: [string, "null"]
          description: Supplied value replaces the stored one; an empty string clears it.
        weaknesses_comment:
          type: [string, "null"]
          description: Supplied value replaces the stored one; an empty string clears it.
        visibility:
          type: [string, "null"]
          description: Must be one of `anonymous`, `named` when supplied.

    FeedbackDraftListResponse:
      type: object
      description: |
        One page of the caller's own draft entries plus the next-page cursor.
        No reviewer redaction applies: the author always sees their own
        `reviewer_id`, even on anonymous drafts.
      properties:
        drafts:
          type: array
          description: The caller's drafts on this page, ordered by created_at descending. Never null (empty array when the caller has no drafts).
          items:
            $ref: "#/components/schemas/FeedbackResponse"
        next_cursor:
          type: string
          format: uuid
          nullable: true
          description: |
            The ID of the last draft on this page; pass it as `cursor` on the
            next request. Null when there are no more pages.
      required: [drafts, next_cursor]
      example:
        drafts:
          - id: 0190abcd-0000-7000-8000-000000000000
            period_id: 0190abca-0000-7000-8000-000000000000
            reviewee_id: 0190bbbb-0000-7000-8000-000000000000
            reviewer_id: 0190aaaa-0000-7000-8000-000000000000
            communication_score: 0
            leadership_score: 0
            technical_score: 0
            collaboration_score: 0
            delivery_score: 0
            trust_score: 0
            strengths_comment: work in progress
            weaknesses_comment: ""
            visibility: anonymous
            status: draft
            created_at: "2026-08-18T10:00:00Z"
            updated_at: "2026-08-18T10:00:00Z"
        next_cursor: null

    FeedbackGivenListResponse:
      type: object
      description: |
        One page of feedback entries the caller has submitted plus the
        next-page cursor. The caller is the reviewer of every entry, so no
        reviewer redaction applies: the author always sees their own
        `reviewer_id`, even on anonymous entries.
      properties:
        feedbacks:
          type: array
          description: The caller's submitted entries on this page, ordered by created_at descending. Never null (empty array when the caller has given no feedback).
          items:
            $ref: "#/components/schemas/FeedbackResponse"
        next_cursor:
          type: string
          format: uuid
          nullable: true
          description: |
            The ID of the last feedback entry on this page; pass it as `cursor`
            on the next request. Null when there are no more pages.
      required: [feedbacks, next_cursor]
      example:
        feedbacks:
          - id: 0190abcd-0000-7000-8000-000000000000
            period_id: 0190abca-0000-7000-8000-000000000000
            reviewee_id: 0190bbbb-0000-7000-8000-000000000000
            reviewer_id: 0190aaaa-0000-7000-8000-000000000000
            communication_score: 4
            leadership_score: 5
            technical_score: 3
            collaboration_score: 4
            delivery_score: 5
            trust_score: 2
            strengths_comment: great teammate
            weaknesses_comment: could document more
            visibility: anonymous
            status: submitted
            created_at: "2026-08-18T10:00:00Z"
            updated_at: "2026-08-18T10:00:00Z"
        next_cursor: null
