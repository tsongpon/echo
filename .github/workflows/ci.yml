name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Auto-cancel superseded PR runs; never cancel in-flight main deploys.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Adjust these three if your GCP naming differs. See docs/gcp-setup.md.
  GCP_REGION: asia-southeast1
  ARTIFACT_REPO: echo
  CLOUD_RUN_SERVICE: echo

permissions:
  # Required for keyless Workload Identity Federation auth.
  id-token: write
  # Required to fetch the commit SHA in deploy steps.
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. Unit tests: run on every push (main + PRs) and on PRs.
  # ---------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  # ---------------------------------------------------------------
  # 2. Build & push container image to Artifact Registry.
  #    Only runs on main after tests pass (skipped on PRs).
  # ---------------------------------------------------------------
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Extract image tag
        id: meta
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:${{ steps.meta.outputs.sha_short }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 3. Deploy to production on Cloud Run. Depends on the image push.
  #    Uses the GitHub "production" environment so protection rules
  #    (required reviewers) can be enabled in repo settings.
  # ---------------------------------------------------------------
  deploy-production:
    name: Deploy to production (Cloud Run)
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Extract image tag
        id: meta
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:${{ steps.meta.outputs.sha_short }}
          # Public access: allUsers gets roles/run.invoker on every deploy.
          # The runtime service account Cloud Run uses for Firestore access.
          flags: >-
            --service-account=${{ secrets.CLOUD_RUN_RUNTIME_SA_EMAIL }}
            --allow-unauthenticated

      - name: Verify public access
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${URL}/ping")
          echo "GET ${URL}/ping -> HTTP ${STATUS}"
          if [ "${STATUS}" != "200" ]; then
            echo "::error::Public /ping check failed (expected 200, got ${STATUS}). Check the invoker binding or auth config."
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo "## Cloud Run deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Service: \`${{ env.CLOUD_RUN_SERVICE }}\` in \`${{ env.GCP_REGION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: \`${{ steps.meta.outputs.sha_short }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
